<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redeem Rewards — Focus Reward</title>
  <meta name="description" content="Redeem your Focus Reward coins for ChatGPT Plus, Coursera Plus, Amazon gift cards and more.">
  <link rel="stylesheet" href="css/dashboard.css">
  <style>
    .redeem-hero {
      text-align: center; padding: 60px 24px 40px;
      position: relative; overflow: hidden;
    }
    .redeem-hero::before {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(ellipse 60% 60% at 50% 30%, rgba(124,58,237,0.08), transparent 70%);
      pointer-events: none;
    }
    .redeem-hero > * { position: relative; }
    .redeem-hero h1 { font-size: 2.2rem; margin-bottom: 8px; }
    .redeem-hero p { font-size: 1rem; max-width: 500px; margin: 0 auto; }
    .redeem-balance {
      display: inline-flex; align-items: center; gap: 10px;
      background: var(--amber-soft); border: 1px solid rgba(245,158,11,0.25);
      border-radius: var(--radius-full); padding: 12px 28px;
      font-family: var(--font-head); font-weight: 700; font-size: 1.3rem; color: var(--amber);
      margin-top: 20px;
    }
    .redeem-container { max-width: 1000px; margin: 0 auto; padding: 0 24px 80px; }
    .redeem-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px; margin-bottom: 48px;
    }
    .r-card {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius-xl); padding: 32px 24px;
      text-align: center; transition: transform 0.3s, border-color 0.3s;
      position: relative; overflow: hidden;
    }
    .r-card:hover { transform: translateY(-6px); border-color: var(--border-accent); }
    .r-card::before {
      content: ''; position: absolute; inset: -1px;
      background: radial-gradient(400px 200px at 50% 0%, var(--card-glow, var(--violet-glow)), transparent 60%);
      pointer-events: none; opacity: 0.2;
    }
    .r-card > * { position: relative; }
    .r-icon { font-size: 3.2rem; margin-bottom: 14px; }
    .r-card h3 { font-size: 1.15rem; color: var(--text-primary); margin-bottom: 3px; }
    .r-card .r-sub { font-size: 0.85rem; color: var(--text-dim); margin-bottom: 6px; }
    .r-card .r-desc { font-size: 0.85rem; margin-bottom: 18px; }
    .r-card .r-value {
      font-size: 0.82rem; color: var(--emerald); font-weight: 600; margin-bottom: 10px;
    }
    .r-cost {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--amber-soft); border: 1px solid rgba(245,158,11,0.2);
      border-radius: var(--radius-full); padding: 8px 20px;
      font-size: 0.95rem; font-weight: 700; color: var(--amber);
      font-family: var(--font-head); margin-bottom: 16px;
    }
    .r-btn {
      display: block; width: 100%; padding: 12px; border-radius: var(--radius-md);
      font-family: var(--font-body); font-size: 0.9rem; font-weight: 600;
      border: none; cursor: pointer; transition: all 0.2s;
    }
    .r-btn.can {
      background: linear-gradient(135deg, var(--emerald), #059669);
      color: white; box-shadow: 0 0 20px var(--emerald-glow);
    }
    .r-btn.can:hover { box-shadow: 0 0 35px var(--emerald-glow); }
    .r-btn.cant {
      background: var(--bg-card2); color: var(--text-dim); cursor: not-allowed;
    }
    .back-link {
      display: inline-flex; align-items: center; gap: 8px;
      color: var(--text-dim); font-size: 0.88rem; margin-bottom: 16px;
      transition: color 0.2s;
    }
    .back-link:hover { color: var(--text-primary); }
  </style>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <div class="topbar-left">
    <a href="/" style="display:flex;align-items:center;gap:10px;text-decoration:none;">
      <img src="images/logo.png" alt="Focus Reward" style="width:32px; height:32px; border-radius:10px;">
      <span class="logo-text">Focus Reward</span>
    </a>
  </div>
  <div class="topbar-right">
    <button id="themeToggleBtn" class="theme-toggle-btn" aria-label="Toggle Theme">◐</button>
    <div class="topbar-coins">🪙 <span id="coinBalance">0</span></div>
    <a href="/dashboard.html" style="color:var(--violet); font-size:0.88rem; font-weight:600;">← Dashboard</a>
    <button class="topbar-logout" id="logoutBtn">Log Out</button>
  </div>
</div>

<div class="redeem-hero">
  <h1>Redemption Marketplace 🎁</h1>
  <p>Spend your hard-earned coins on premium subscriptions and gift cards.</p>
  <div class="redeem-balance">🪙 <span id="heroBalance">0</span> coins available</div>
</div>

<div class="redeem-container">
  <div class="redeem-grid" id="redeemGrid">
    <p style="padding:20px; color:var(--text-dim);">Loading rewards...</p>
  </div>

  <h3 style="font-size:1.1rem; margin-bottom:16px; color: var(--text-primary);">Redemption History</h3>
  <div class="activity-list" id="historyList">
    <p style="padding:20px; color:var(--text-dim);">No redemptions yet.</p>
  </div>
</div>

<!-- COIN TOAST -->
<div class="coin-toast" id="coinToast">
  <span class="toast-icon">🎁</span>
  <span class="toast-text" id="toastText">Reward redeemed!</span>
</div>

<script src="js/mock-data.js?v=1791830100"></script>
<script src="js/config.js?v=1791830100"></script>
<script src="js/redeem.js?v=1791830100"></script>
</body>
</html>
